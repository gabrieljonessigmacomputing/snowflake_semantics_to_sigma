# .github/workflows/sigma-semantic-sync.yml
# Sync Snowflake semantic views to Sigma on every push to main.
name: Sync semantic views to Sigma

on:
  push:
    branches: [main]
  workflow_dispatch: # runs every view (mode defaults to "all" here)

permissions:
  contents: write # commit the lockfile back

concurrency:
  group: sigma-semantic-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: twells89/snowflake_semantics_to_sigma@v1
        with:
          sigma_base_url: ${{ vars.SIGMA_BASE_URL }}
          sigma_client_id: ${{ secrets.SIGMA_CLIENT_ID }}
          sigma_client_secret: ${{ secrets.SIGMA_CLIENT_SECRET }}
          connection_id: ${{ vars.SIGMA_CONNECTION_ID }}
          folder_id: ${{ vars.SIGMA_FOLDER_ID }}
          paths: semantic_views/**/*.{yaml,yml,sql}
          database: ANALYTICS
          schema: SEMANTIC
